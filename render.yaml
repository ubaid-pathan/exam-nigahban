# Render Blueprint for the Exam Nigahban API.
#
# With this file in the repository, Render's "New > Blueprint" reads the
# whole service definition from here rather than needing it typed into a
# form: build command, start command, plan, health check and which
# environment variables are required. That removes the settings most often
# got wrong by hand -- particularly the worker count, which this system
# depends on (see backend/Procfile for why).
#
# Two values must be supplied in the dashboard, because they are secrets or
# environment-specific and must never live in the repository. Render marks
# them as required and refuses to deploy until they are set, which is
# better than deploying with a wrong default:
#
#   DATABASE_URL   the Neon (or other PostgreSQL) connection string
#   CORS_ORIGINS   the EXACT origin the frontend is served from
#
# SECRET_KEY is generated by Render itself, so nobody has to invent one and
# it is never seen or committed. The application refuses to start on a
# short or placeholder key, so this also guarantees a valid one.

services:
  - type: web
    name: exam-nigahban-api
    runtime: python
    plan: free
    rootDir: backend

    # build.sh installs dependencies, creates missing tables, applies the
    # ADD COLUMN migrations that create_all cannot, reports any schema
    # drift into this log, and seeds demo data. Each step is idempotent, so
    # it is safe on every deploy including the first.
    buildCommand: ./build.sh

    # --workers 1 is required, not a performance choice: the WebSocket
    # connection registries and the step-up lockout counters live in this
    # process's memory and are not shared between workers. See
    # backend/Procfile for the full reasoning.
    startCommand: >-
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:$PORT

    healthCheckPath: /health

    envVars:
      # Generated by Render: never invented by a person, never committed,
      # and always long enough to satisfy the startup check.
      - key: SECRET_KEY
        generateValue: true

      # sync: false means "prompt me for this and do not deploy without
      # it". Both are deployment-specific and must not be guessed.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: ENVIRONMENT
        value: production
      - key: DB_DRIVER
        value: postgresql

      # Local filesystem storage. Render's disk is ephemeral, so evidence
      # images are lost on redeploy -- the API keeps a base64 copy in the
      # database as a fallback, which is why this remains usable. Switch to
      # "s3" and add the EVIDENCE_S3_* values for durable storage, then run
      # migrate_evidence_to_s3.py once (see backend/.env.example).
      - key: EVIDENCE_BACKEND
        value: local

      - key: LOG_LEVEL
        value: INFO

      # Pinned so the runtime does not drift under the application on a
      # later rebuild.
      - key: PYTHON_VERSION
        value: "3.12.6"
